services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tools
      POSTGRES_PASSWORD: tools123
      POSTGRES_DB: toolsvilla
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.6
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: toolsvilla-master-key-change-me
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    ports:
      - "7700:7700"

  backend:
    build: ./apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tools:tools123@postgres:5432/toolsvilla
      REDIS_URL: redis://redis:6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxxx}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-xxxx}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_xxxx}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-long-random-string}
      PORT: 9000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "9000:9000"

  storefront:
    build: ./apps/storefront
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:9000}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_xxxx}
      NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-ToolsKart}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  meilidata:
