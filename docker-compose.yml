services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tools
      POSTGRES_PASSWORD: tools123
      POSTGRES_DB: toolsvilla
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tools"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  backend:
    build: ./apps/backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tools:tools123@postgres:5432/toolsvilla
      REDIS_URL: redis://redis:6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_xxxx}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-xxxx}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-whsec_xxxx}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-long-random-string}
      PORT: 9000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "9000:9000"

  storefront:
    build:
      context: ./apps/storefront
      # NEXT_PUBLIC_* are inlined into the JS bundle at build time.
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:9000}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_xxxx}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-ToolsKart}
        NEXT_PUBLIC_STORE_PHONE: ${NEXT_PUBLIC_STORE_PHONE:-919999999999}
        NEXT_PUBLIC_STORE_EMAIL: ${NEXT_PUBLIC_STORE_EMAIL:-care@toolskart.in}
        NEXT_PUBLIC_STORE_GSTIN: ${NEXT_PUBLIC_STORE_GSTIN:-00AAAAA0000A1Z5}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:9000}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_xxxx}
      NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-ToolsKart}
      NEXT_PUBLIC_STORE_PHONE: ${NEXT_PUBLIC_STORE_PHONE:-919999999999}
      NEXT_PUBLIC_STORE_EMAIL: ${NEXT_PUBLIC_STORE_EMAIL:-care@toolskart.in}
      NEXT_PUBLIC_STORE_GSTIN: ${NEXT_PUBLIC_STORE_GSTIN:-00AAAAA0000A1Z5}
    ports:
      - "3000:3000"

  # Single-domain reverse proxy. Comment this block out if you prefer Cloudflare
  # Tunnel or two subdomains pointing straight at :3000 / :9000.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - storefront
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
