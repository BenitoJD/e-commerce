# upstream backend
upstream backend_up {
  server backend:9000;
}
# upstream storefront
upstream store_up {
  server storefront:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # Razorpay webhook — must be reachable + fast, no cache
  location /api/webhooks/ {
    proxy_pass http://backend_up/webhooks/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
  }

  location /api/ {
    proxy_pass http://backend_up/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://store_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
