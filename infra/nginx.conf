# Reverse proxy for the single-domain deployment.
#   https://yourdomain.com/        -> storefront (Next.js :3000)
#   https://yourdomain.com/api/*   -> backend   (:9000)  (path is stripped)
#   https://yourdomain.com/api/webhooks/razorpay -> backend /webhooks/razorpay
#
# With this layout the storefront must be BUILT with
#   NEXT_PUBLIC_BACKEND_URL=https://yourdomain.com/api
# TLS is usually terminated by Cloudflare; for direct TLS add a 443 server block
# with certbot certificates (see docs/VPS-DEPLOY.md).

upstream backend_up {
  server backend:9000;
}

upstream store_up {
  server storefront:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # Text responses are compressed unless the upstream already did it (nginx never
  # double-compresses); images/binaries are skipped by the type list.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml application/rss+xml image/svg+xml;

  # ---- backend API ----
  # Razorpay webhook: must be publicly reachable, fast, never cached.
  location = /api/webhooks/razorpay {
    proxy_pass http://backend_up/webhooks/razorpay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_buffering off;
  }

  location /api/ {
    proxy_pass http://backend_up/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Health/readiness straight through (point monitors at /ready)
  location = /ready {
    proxy_pass http://backend_up/ready;
    proxy_set_header Host $host;
  }

  # ---- storefront ----
  # Immutable Next.js build assets: cache hard at the edge/proxy.
  location /_next/static/ {
    proxy_pass http://store_up;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Catalogue images are content that changes rarely: a week of browser cache cuts repeated
  # requests per page view, while a replaced image is picked up within a day.
  location /images/ {
    proxy_pass http://store_up;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
  }

  # Crawlers re-fetch these often; serving them from the proxy for ten minutes is plenty.
  location = /robots.txt {
    proxy_pass http://store_up;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=600";
  }

  location = /sitemap.xml {
    proxy_pass http://store_up;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=600";
  }

  location / {
    proxy_pass http://store_up;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
